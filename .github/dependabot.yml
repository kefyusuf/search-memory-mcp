# Weekly dependency updates. npm minor/patch updates are grouped into one PR to
# limit noise; majors arrive as individual PRs because they carry breaking-change
# migrations that are reviewed separately. CI validates every PR, including the
# native-module overrides (better-sqlite3, sharp).
# The `github-actions` ecosystem bumps the SHA-pinned workflow actions in place.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Node 26 is excluded project-wide (`engines` <26 in package.json, .nvmrc = 24;
      # better-sqlite3 and part of the test suite do not hold on Node 26 yet).
      - dependency-name: node
        versions: [">=26"]
