name: One-off Docker browser egress smoke

# Temporary pre-merge verification for PR #57; remove after evidence capture.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  docker-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production Docker image with Chromium
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: search-memory-mcp:security-browser-smoke
          cache-from: type=gha
      - name: Exercise guarded Chromium egress INSIDE production container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/scripts:/app/scripts:ro" \
            --entrypoint node \
            search-memory-mcp:security-browser-smoke \
            scripts/verify-browser-egress-proxy.mjs
