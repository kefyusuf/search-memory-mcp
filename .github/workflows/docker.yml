name: Docker image

# Pull requests that touch the image build and smoke-test it without pushing.
# Pushes to main publish :latest and :sha-<commit>; v* tags publish semver tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - docker-compose.yml
      - docker/**
      - .github/workflows/docker.yml

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: search-memory-mcp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image over stdio
        env:
          SMOKE_DOCKER_IMAGE: search-memory-mcp:smoke
        run: node scripts/smoke-mcp.mjs

      - name: Check the optional SearXNG service answers JSON
        env:
          SEARXNG_SECRET: ci-only-secret
        run: |
          docker compose --profile searxng config --quiet
          docker compose --profile searxng up -d searxng
          for attempt in $(seq 1 30); do
            if docker compose exec -T searxng wget -qO /tmp/out.json "http://localhost:8080/search?q=searxng&format=json"; then
              docker compose exec -T searxng sh -c 'head -c 200 /tmp/out.json'; echo
              docker compose exec -T searxng grep -q '"results"' /tmp/out.json
              exit 0
            fi
            sleep 2
          done
          docker compose logs searxng
          exit 1

      - name: Clean up SearXNG
        if: always()
        run: docker compose --profile searxng down --volumes

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish amd64 and arm64 images
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
