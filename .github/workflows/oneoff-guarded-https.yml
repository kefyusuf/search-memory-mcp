name: One-off guarded HTTPS verification

# Temporary release-gate workflow for PR #55. Remove after collecting evidence.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-public-https:
    name: Public HTTPS / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ["20.9.0", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Compiling the HTTP transport does not need native addons or Chromium.
      - name: Install dependencies without postinstall side effects
        run: npm ci --ignore-scripts
      - name: Compile guarded HTTP transport
        run: npx tsc
      - name: Test real public HTTPS using production guardedHttpFetch
        run: |
          node --input-type=module <<'NODE'
          import { guardedHttpFetch } from "./build/security/guarded-fetch.js";
          const url = "https://example.com/";
          const response = await guardedHttpFetch(url, {
            signal: AbortSignal.timeout(15000),
          });
          try {
            if (!response.ok) {
              throw new Error("Public HTTPS returned HTTP " + response.status);
            }
            if (new URL(response.url).hostname !== "example.com") {
              throw new Error("Unexpected HTTP response origin");
            }
            console.log("PASS guarded HTTPS", process.version, response.status, new URL(response.url).hostname);
          } finally {
            await response.body?.cancel();
          }
          NODE
