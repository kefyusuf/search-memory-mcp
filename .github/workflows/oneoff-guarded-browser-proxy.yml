name: One-off guarded browser proxy proof

# Remove this workflow after collecting browser evidence; not a release gate yet.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium-proxy-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run build
      - name: Exercise Chromium against guarded local proxy
        run: node scripts/verify-browser-egress-proxy.mjs
