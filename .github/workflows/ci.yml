name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      membership-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: websearch_membership_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d websearch_membership_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install chromium

      - run: npm run build

      - run: npm run typecheck

      - run: npm test

      - run: npm run smoke:mcp

      - name: Verify membership against real PostgreSQL
        run: npm run test:postgres
        env:
          MEMBERSHIP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/websearch_membership_test

      - name: Verify fixture cleanup with delayed connection shutdown
        run: npm run test:postgres:shutdown
        env:
          MEMBERSHIP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/websearch_membership_test

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - run: npm pack --dry-run --json
