name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # playwright 1.59 does not ship chromium builds for ubuntu-26.04 (ubuntu-latest since 2026-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install chromium

      - run: npm run build

      - run: npm run typecheck

      - run: npm run typecheck:tests

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/

      - name: Verify Chromium outbound socket policy (real browser)
        run: node scripts/verify-browser-egress-proxy.mjs

      - run: npm run smoke:mcp

      - name: Offline quality set (P1-03, FTS baseline)
        run: npm run eval:quality

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - run: npm pack --dry-run --json

  verify-postgres:
    # Synthetic Postgres-backed verifications run in parallel with the core suite.
    # They need only the build output, not Chromium.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MEMBERSHIP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/websearch_membership_test
    services:
      membership-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: websearch_membership_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d websearch_membership_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Verify membership against real PostgreSQL
        run: npm run test:postgres

      - name: Verify fixture cleanup with delayed connection shutdown
        run: npm run test:postgres:shutdown

      - name: Verify restore authorization (TR-03/TR-04/TR-05, synthetic)
        run: npm run test:restore-authorization

      - name: Verify hosted HTTP ingress end-to-end (synthetic)
        run: npm run test:hosted-ingress

      - name: Verify activation/fencing (TA-01..TA-07, synthetic)
        run: npm run test:activation-fencing

      - name: Verify hosted bootstrap end-to-end (synthetic)
        run: npm run test:hosted-bootstrap

      - name: Verify D2-E operational drill (synthetic)
        run: npm run test:d2e-drill

      - name: Verify provisioning API (Faz C, synthetic)
        run: npm run test:provisioning

  test-windows:
    # Windows is a large share of MCP clients (Claude Desktop, Cursor), so the core
    # offline suite should hold there too. Postgres-backed verifications, the browser
    # egress proxy drill and the audit stay on the Linux job (service containers are
    # Linux-only; the egress drill is validated there and locally per release).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # The runner image converts LF to CRLF on checkout by default, which breaks
      # fixture expectations and Biome format:check; tests run against LF content.
      - name: Disable git line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install chromium

      - run: npm run build

      - run: npm run typecheck

      - run: npm run typecheck:tests

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      - run: npm run smoke:mcp
