name: One-off final Chromium egress gate

# Security evidence only; delete after capturing results. No publishing.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run build
      - name: Test real Chromium DNS, redirect, WS, UDP and public HTTPS
        run: node scripts/verify-browser-egress-proxy.mjs
