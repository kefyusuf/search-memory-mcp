name: One-off browser egress fixture

# Design-gate evidence only. Delete this workflow after collecting logs.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install dependencies without setup scripts
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Build existing ContentFetcher
        run: npm run build
      - name: Observe real Chromium socket destinations using loopback-only fixture
        run: node scripts/probe-playwright-egress.mjs
