name: Release

# Publishes the npm package (with provenance) and the MCP Registry entry when a
# v* tag is pushed. The Docker image for the same tag is built by docker.yml.
on:
  push:
    tags: ["v*"]
  # Re-run the publish steps for the version on the selected ref; finished steps are skipped.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance, MCP Registry GitHub OIDC login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Check tag matches package.json and server.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          srv="$(node -p "require('./server.json').version")"
          srvpkg="$(node -p "require('./server.json').packages[0].version")"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$srv" ] || [ "$tag" != "$srvpkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($pkg) / server.json ($srv, $srvpkg)"
            exit 1
          fi

      # npm trusted publishing (OIDC, no token) needs npm 11.5.1 or later.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run build

      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "search-memory-mcp@$version" version >/dev/null 2>&1; then
            echo "search-memory-mcp@$version is already on npm; skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
          MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8 # mcp-publisher_linux_amd64.tar.gz
        run: |
          # The registry checks the npm package, which can take a minute to become visible.
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            npm view "search-memory-mcp@$version" version >/dev/null 2>&1 && break
            echo "Waiting for search-memory-mcp@$version on npm ($attempt/30)"
            sleep 10
          done
          # Pinned release; the digest above was recorded when v1.8.9 shipped (2026-11-10).
          # Releases also publish .sigstore.json bundles if verification is hardened later.
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
