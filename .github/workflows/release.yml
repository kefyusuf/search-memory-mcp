name: Release

# Publishes the npm package (with provenance) and the MCP Registry entry when a
# v* tag is pushed. The Docker image for the same tag is built by docker.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance and MCP Registry GitHub OIDC login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Check tag matches package.json and server.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          srv="$(node -p "require('./server.json').version")"
          srvpkg="$(node -p "require('./server.json').packages[0].version")"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$srv" ] || [ "$tag" != "$srvpkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($pkg) / server.json ($srv, $srvpkg)"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
