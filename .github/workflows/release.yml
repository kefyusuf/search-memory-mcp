name: Release

# Publishes the npm package (with provenance) and the MCP Registry entry when a
# v* tag is pushed. The Docker image for the same tag is built by docker.yml.
on:
  push:
    tags: ["v*"]
  # Re-run the publish steps for the version on the selected ref; finished steps are skipped.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance and MCP Registry GitHub OIDC login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Check tag matches package.json and server.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          srv="$(node -p "require('./server.json').version")"
          srvpkg="$(node -p "require('./server.json').packages[0].version")"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$srv" ] || [ "$tag" != "$srvpkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($pkg) / server.json ($srv, $srvpkg)"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "search-memory-mcp@$version" version >/dev/null 2>&1; then
            echo "search-memory-mcp@$version is already on npm; skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to the MCP Registry
        run: |
          # The registry checks the npm package, which can take a minute to become visible.
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            npm view "search-memory-mcp@$version" version >/dev/null 2>&1 && break
            echo "Waiting for search-memory-mcp@$version on npm ($attempt/30)"
            sleep 10
          done
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
