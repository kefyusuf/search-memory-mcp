name: One-off browser proxy feasibility

# Offline-only one-off security design test. Remove after collecting evidence.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Probe Chromium proxy for loopback bypasses
        run: node scripts/probe-playwright-proxy.mjs
